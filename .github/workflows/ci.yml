name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests without OCR or real receipts
        run: python -m pytest -m "not integration and not ocr"
